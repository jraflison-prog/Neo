<script>
// Patch kamera ditolak: jangan alert blocking, tampilkan toast + tetap aktifkan kontrol mouse/touch
(function(){
  const origAlert = window.alert;
  window.alert = function(msg){
    if(String(msg).includes('kamera') || String(msg).includes('Kamera') || String(msg).includes('camera')){
      let toast=document.getElementById('cam-denied-toast');
      if(!toast){
        toast=document.createElement('div');
        toast.id='cam-denied-toast';
        toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(2,8,23,0.92);border:1px solid rgba(6,182,212,.6);color:#e2f5ff;padding:12px 16px;border-radius:14px;font-size:13px;text-align:center;max-width:92vw;backdrop-filter:blur(10px);box-shadow:0 0 20px rgba(0,240,255,.3)';
        toast.innerHTML='<b style="color:#00f0ff">Kamera ditolak</b><br>Hologram tetap jalan pakai Mouse / Sentuh.<br><span style="opacity:.8">Tap di sini untuk coba izin lagi</span>';
        toast.onclick=()=>{ toast.remove(); location.reload(); };
        document.body.appendChild(toast);
        setTimeout(()=>{ if(toast) toast.style.opacity='0.9'; }, 8000);
      }
      return;
    }
    return origAlert(msg);
  };
})();
</script>

<script>
// === LOCALHOST AUTO-HANDLER di dalam neo.html ===
(function(){
  const isFile = window.location.protocol === 'file:';
  const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const isSecure = window.isSecureContext;

  // Kalau sudah localhost / https, langsung jalan, tidak perlu apa-apa
  if(isLocalhost || window.location.protocol === 'https:'){
    console.log('Neo: secure context OK - kamera diizinkan');
    return;
  }

  // Kalau dibuka via file:// -> coba auto-redirect ke localhost:8000 jika server sudah jalan
  if(isFile){
    // Coba ping localhost:8000
    fetch('http://localhost:8000/neo.html', {method:'HEAD', mode:'no-cors'}).then(()=>{
      // Server kemungkinan jalan, redirect
      const overlay=document.createElement('div');
      overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#e2f5ff;font-family:sans-serif';
      overlay.innerHTML='<div style="font-size:28px">📡</div><h2 style="color:#00f0ff;margin:0">Server Localhost Terdeteksi</h2><p style="opacity:.85;max-width:360px">File dibuka lewat file://, kamera akan ditolak. Pindah ke localhost biar kamera diizinkan.</p><button id="go-localhost" style="background:#06b6d4;color:#020617;border:none;padding:12px 24px;border-radius:12px;font-weight:700;cursor:pointer">Buka http://localhost:8000/neo.html</button><button id="stay-offline" style="background:rgba(255,255,255,.1);color:#e2f5ff;border:1px solid rgba(255,255,255,.3);padding:10px 20px;border-radius:12px;cursor:pointer">Tetap Jalan Tanpa Kamera</button>';
      document.body.appendChild(overlay);
      document.getElementById('go-localhost').onclick=()=>{ window.location.href='http://localhost:8000/neo.html'; };
      document.getElementById('stay-offline').onclick=()=>{ overlay.remove(); };
      // Auto-redirect 2 detik kalau user tidak pilih
      setTimeout(()=>{ if(document.body.contains(overlay)) window.location.href='http://localhost:8000/neo.html'; }, 3000);
    }).catch(()=>{
      // Server belum jalan - tampilkan cara nyalakan
      const overlay=document.createElement('div');
      overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#e2f5ff;font-family:sans-serif';
      overlay.innerHTML='<div style="font-size:28px">⚠️</div><h2 style="color:#00f0ff;margin:0">Kamera Ditolak karena file://</h2><p style="opacity:.85;max-width:380px;line-height:1.5">Ini bukan error file. Chrome blokir kamera di file://.<br><br><b style="color:#fff">Solusi 1 - Termux:</b><br><code style="background:#0f172a;padding:6px 10px;border-radius:8px;display:inline-block;margin:4px 0">python3 -m http.server 8000</code><br>lalu buka <b>http://localhost:8000/neo.html</b><br><br><b style="color:#fff">Solusi 2:</b> Tap tombol bawah untuk tetap jalan tanpa kamera</p><button id="stay2" style="background:#06b6d4;color:#020617;border:none;padding:12px 24px;border-radius:12px;font-weight:700;cursor:pointer">Tetap Jalan Tanpa Kamera</button>';
      document.body.appendChild(overlay);
      document.getElementById('stay2').onclick=()=>{ overlay.remove(); };
    });
  }
})();
</script>
</body>
